<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result - QuizRank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="result-container">

        <h1>Quiz Completed!</h1>

        <h2>Your Result</h2>

        <div class="result-box">

            <p>
                Score:
                <strong><span id="score">0</span></strong>
                /
                <strong><span id="total">0</span></strong>
            </p>

            <p>
                Percentage:
                <strong><span id="percentage">0</span>%</strong>
            </p>

            <h3 id="message"></h3>

        </div>

        <button id="leaderboardBtn">
            View Leaderboard
        </button>
         <button id="dashboardBtn">
    ⬅ Back to Dashboard
</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
